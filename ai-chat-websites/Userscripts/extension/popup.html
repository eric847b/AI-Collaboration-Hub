<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified AI Assistant Suite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 400px; min-height: 320px;
      background: #1a1a2e; color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
      border-bottom: 1px solid #333; padding-bottom: 12px;
    }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 8px 12px; border-radius: 6px 6px 0 0;
      background: #16213e; cursor: pointer; font-size: 13px;
      border: 1px solid #333; border-bottom: none; color: #aaa;
    }
    .tab.active { background: #0f3460; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    input, textarea, select {
      width: 100%; padding: 8px; border-radius: 4px;
      background: #16213e; border: 1px solid #333; color: #e0e0e0;
      font-size: 13px;
    }
    textarea { min-height: 100px; resize: vertical; font-family: monospace; }
    button {
      width: 100%; padding: 10px; border-radius: 6px;
      background: #0f3460; color: #fff; border: none;
      font-size: 14px; cursor: pointer; font-weight: 500;
    }
    button:hover { background: #1a4a8a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .output {
      background: #0d1b2a; border-radius: 6px; padding: 10px;
      font-family: monospace; font-size: 11px; white-space: pre-wrap;
      overflow-y: auto; max-height: 200px; margin-top: 10px;
      border: 1px solid #333;
    },
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="Logo" />
    <h1>AI Assistant Suite</h1>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('generate')">Generate</div>
    <div class="tab" onclick="showTab('config')">Config</div>
    <div class="tab" onclick="showTab('history')">History</div>
  </div>
  <div id="generate" class="tab-content active">
    <div class="form-group">
      <label>Provider</label>
      <select id="provider">
        <option value="openai">OpenAI (GPT-4o)</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="gemini">Google (Gemini)</option>
        <option value="ollama">Ollama (Local)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Model</label>
      <input type="text" id="model" placeholder="gpt-4o" />
    </div>
    <div class="form-group">
      <label>Temperature</label>
      <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7" />
      <span id="temp-value" style="font-size:11px;color:#888">0.7</span>
    </div>
    <div class="form-group">
      <label>Your Prompt</label>
      <textarea id="prompt" placeholder="Describe the script you want to generate..."></textarea>
    </div>
    <button id="generate-btn" onclick="generateScript()">Generate Script</button>
    <div class="output" id="output"></div>
  </div>
  <div id="config" class="tab-content">
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="api-key" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label>Provider</label>
      <select id="config-provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="gemini">Google Gemini</option>
        <option value="ollama">Ollama</option>
      </select>
    </div>
    <button onclick="saveConfig()">Save Configuration</button>
  </div>
  <div id="history" class="tab-content">
    <div class="output" id="history-list">No history yet</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
