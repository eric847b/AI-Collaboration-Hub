name: Mark stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'  # Daily at 1:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 60 days. It will be closed in 7 days if no further activity occurs. Comment to keep it open.'
          stale-pr-message: 'This pull request has been inactive for 45 days. It will be closed in 10 days if no further activity occurs.'
          close-issue-message: 'Closing due to inactivity. Reopen if this is still relevant.'
          close-pr-message: 'Closing due to inactivity. Reopen if this is still relevant.'
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 7
          days-before-pr-close: 10
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,help-wanted'
          exempt-pr-labels: 'pinned,security,wip'
          labels-to-remove-when-unstale: 'stale'
