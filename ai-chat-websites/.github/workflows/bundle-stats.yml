name: Bundle Statistics

on:
  push:
    branches: [ main ]
    paths:
      - 'Userscripts/AI Chat Userscript Studio/Userscript Suite/dist/**'
  pull_request:
    paths:
      - 'Userscripts/AI Chat Userscript Studio/Userscript Suite/dist/**'

jobs:
  stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Userscripts/AI Chat Userscript Studio/Userscript Suite'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run bundle stats
        run: npm run bundle:analyze || echo "No dist files to analyze"
      - name: Upload stats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-statistics
          path: 'dist/*.stats.json'