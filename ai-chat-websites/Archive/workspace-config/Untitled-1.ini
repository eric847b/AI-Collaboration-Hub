// Attach event listeners to UI elements
function attachEventListeners() {
    const uiElements = document.querySelectorAll('[data-chatgpt-action]');
    uiElements.forEach(element => {
        const action = element.getAttribute('data-chatgpt-action');
        element.addEventListener('click', () => {
            if (typeof chatgpt.actions[action] === 'function') {
                chatgpt.actions[action]();
            }
        });
    });
}

// Define a function to handle UI updates
function handleUIUpdates() {
    categories.forEach(category => {
        if (chatgpt[category] && typeof chatgpt[category].hasNew === 'function') {
            if (chatgpt[category].hasNew()) {
                const updateFunction = `update${category.charAt(0).toUpperCase() + category.slice(1)}`;
                if (typeof chatgpt.ui[updateFunction] === 'function') {
                    chatgpt.ui[updateFunction]();
                }
            }
        }
    });
}

// Set up periodic UI updates
function setupPeriodicUpdates(interval = 60000) {
    const updateInterval = setInterval(handleUIUpdates, interval);
    return () => clearInterval(updateInterval);
}

// Initialize the application
function initializeApplication() {
    initializeUI();
    const clearPeriodicUpdates = setupPeriodicUpdates();
    
    // Add error handling
    window.addEventListener('error', (event) => {
        console.error('An error occurred:', event.error);
        // Implement proper error logging or user notification here
        if (typeof chatgpt.errorHandler === 'function') {
            chatgpt.errorHandler(event.error);
        }
    });

    // Return a cleanup function
    return function cleanup() {
        clearPeriodicUpdates();
        // Remove other event listeners and perform necessary cleanup
        window.removeEventListener('error', chatgpt.errorHandler);
        document.removeEventListener('DOMContentLoaded', attachEventListeners);
        // Additional cleanup logic can be added here
    };
}

// Call initializeApplication when the DOM is fully loaded
let cleanup;
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        cleanup = initializeApplication();
    });
} else {
    cleanup = initializeApplication();
}

// Expose a method to manually trigger UI updates
chatgpt.triggerUIUpdate = handleUIUpdates;

// Add a cleanup function to remove intervals and event listeners
chatgpt.cleanup = function() {
    if (typeof cleanup === 'function') {
        cleanup();
    }
    // Additional cleanup logic
    categories.forEach(category => {
        if (chatgpt[category] && typeof chatgpt[category].cleanup === 'function') {
            chatgpt[category].cleanup();
        }
    });
};

// Add a method to get user segmentation metrics
chatgpt.getUserSegmentationMetrics = function(timeFrame) {
    const users = chatgpt.getUserData(timeFrame);
    
    const segments = {
        newUsers: 0,
        casualUsers: 0,
        regularUsers: 0,
        powerUsers: 0
    };
    
    users.forEach(user => {
        const conversationCount = user.conversations.length;
        if (conversationCount === 1) {
            segments.newUsers++;
        } else if (conversationCount >= 2 && conversationCount <= 5) {
            segments.casualUsers++;
        } else if (conversationCount >= 6 && conversationCount <= 20) {
            segments.regularUsers++;
        } else {
            segments.powerUsers++;
        }
    });
    
    const totalUsers = users.length;
    
    return {
        totalUsers,
        segments: Object.entries(segments).map(([segment, count]) => ({
            segment,
            count,
            percentage: (count / totalUsers) * 100
        }))
    };
};

// Add a method to implement serendipitous recommendations
chatgpt.getSerendipitousRecommendations = function(userId) {
    const user = chatgpt.getUserData(userId);
    const allTopics = chatgpt.getAllTopics();
    const userInterests = user.interests || [];
    
    // Filter out topics the user has already shown interest in
    const newTopics = allTopics.filter(topic => !userInterests.includes(topic));
    
    // Randomly select a few new topics
    const recommendations = [];
    const numRecommendations = Math.min(3, newTopics.length);
    
    for (let i = 0; i < numRecommendations; i++) {
        const randomIndex = Math.floor(Math.random() * newTopics.length);
        recommendations.push(newTopics.splice(randomIndex, 1)[0]);
    }
    
    // Get related content for each recommended topic
    const serendipitousContent = recommendations.map(topic => ({
        topic: topic,
        content: chatgpt.getRelatedContent(topic)
    }));
    
    return serendipitousContent;
};
