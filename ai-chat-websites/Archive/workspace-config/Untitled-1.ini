// NOTE: This script relies on the powerful chatgpt.js library @ https://github.com/KudoAI/chatgpt.js © 2023–2024 KudoAI & contributors under the MIT license.
(async () => {
    // Init APP info
    const app = {
        urls: {
            chatgptJS: 'https://github.com/KudoAI/chatgpt.js',
            gitHub: 'https://github.com/adamlui/chatgpt-infinity',
        },
        name: 'ChatGPT Unlimited Code Improvements',
        author: { name: 'Anonymous' },
        configKeyPrefix: 'chatgpt_infinity',
        latestAssetCommitHash: 'bdddd20' // for cached messages.json + navicon
    }
    app.urls.assetHost = `${app.urls.gitHub.replace('github.com', 'cdn.jsdelivr.net/gh')}@${app.latestAssetCommitHash}`;
    app.urls.update = app.urls.gitHub.replace(/(\d+)-?([a-zA-Z-]*)$/, (_, id, name) => `${id}/${name || 'script'}.meta.js`);

    // Init ENV info
    const env = {
        browser: { isMobile: chatgpt.browser.isMobile(), isFF: chatgpt.browser.isFirefox() },
        scriptManager: (() => { 
            try { 
                return GM_info.scriptHandler;
            } catch (err) { 
                return 'other';
            }
        })()
    }

    // Init CONFIG
    const config = {};
    const settings = {
        load(...keys) {
            keys = Array.isArray(keys[0]) ? keys[0] : keys; // use 1st array arg, else all comma-separated ones
            keys.forEach(key => config[key] = GM_getValue(`${app.configKeyPrefix}_${key}`, false));
        },
        save(key, value) { 
            GM_setValue(`${app.configKeyPrefix}_${key}`, value);
            config[key] = value;
        }
    };
    
    settings.load('autoScrollDisabled', 'autoStart', 'replyInterval', 'replyTopic', 'toggleHidden', 'infinityMode');
    if (!config.replyTopic) settings.save('replyTopic', 'ALL'); // init reply topic if unset
    if (!config.replyInterval) settings.save('replyInterval', 7); // init refresh interval to 7 secs if unset

    // Init app MESSAGES
    const xhr = env.scriptManager === 'OrangeMonkey' ? GM_xmlhttpRequest : GM.xmlHttpRequest;
    app.msgs = {
        appName: app.name,
        appAuthor: app.author.name,
        appDesc: 'Generate endless answers from all-knowing ChatGPT',
        menuLabel_infinityMode: 'Infinity Mode',
        menuLabel_autoStart: 'Auto-Start',
        menuLabel_toggleVis: 'Toggle Visibility',
        menuLabel_autoScroll: 'Auto-Scroll',
        menuLabel_replyTopic: 'Reply Topic',
        menuLabel_all: 'ALL',
        menuLabel_replyInt: 'Reply Interval',
        menuLabel_about: 'About',
        menuLabel_donate: 'Please send a donation',
        menuLabel_disabled: 'Disabled (extension installed)',
        about_version: 'Version',
        about_poweredBy: 'Powered by',
        about_sourceCode: 'Source code',
        prompt_updateReplyTopic: 'Update reply topic',
        prompt_orEnter: 'or enter',
        prompt_updateReplyInt: 'Update reply interval (minimum 5 secs)',
        alert_replyTopicUpdated: 'Topic updated',
        alert_willAnswer: 'will answer questions',
        alert_onTopicOf: 'on the topic of',
        alert_onAllTopics: 'on ALL topics',
        alert_replyIntUpdated: 'Interval updated',
        alert_willReplyEvery: 'will reply every',
        alert_choosePlatform: 'Choose a platform',
        alert_updateAvail: 'Update available',
        alert_newerVer: 'An update to',
        alert_isAvail: 'is available',
        alert_upToDate: 'Up-to-date',
        alert_isUpToDate: 'is up-to-date',
        alert_showYourSupport: 'Show your support',
        alert_isOSS: 'is open-source software built & maintained for free through 100% volunteer efforts',
        alert_despiteAffliction: 'Despite being severely afflicted by',
        alert_longCOVID: 'long COVID',
        alert_since2020: 'since 2020',
        alert_byDonatingResults: 'by donating, you help me to continue improving, fixing bugs, adding new features, and making the software even better',
        alert_yourContrib: 'Your contribution',
        alert_noMatterSize: 'no matter the size',
        alert_directlySupports: 'directly supports my unpaid efforts to ensure this project remains free and open for all to use',
        alert_tyForSupport: 'Thank you for your support',
        alert_author: 'author',
        btnLabel_moreApps: 'More ChatGPT Apps',
        btnLabel_rateUs: 'Rate Us',
        btnLabel_getSupport: 'Get Support',
        btnLabel_updateCheck: 'Check for Updates',
        btnLabel_update: 'Update',
        btnLabel_dismiss: 'Dismiss',
        link_viewChanges: 'View changes',
        unit_seconds: 'seconds',
        state_enabled: 'enabled',
        state_disabled: 'disabled',
        state_on: 'on',
        state_off: 'off'
    };

    // Init SETTINGS props
    Object.assign(app, { settings: {
        autoStart: { type: 'toggle', label: app.msgs.menuLabel_autoStart },
        toggleHidden: { type: 'toggle', label: app.msgs.menuLabel_toggleVis },
        autoScrollDisabled: { type: 'toggle', label: app.msgs.menuLabel_autoScroll },
        replyTopic: { type: 'prompt', symbol: '🧠', label: app.msgs.menuLabel_replyTopic },
        replyInterval: { type: 'prompt', symbol: '⌚', label: app.msgs.menuLabel_replyInt }
    }});

    // Define MENU functions
    const menu = {
        ids: [],
        state: {
            symbols: ['❌', '✔️'],
            separator: env.scriptManager === 'Tampermonkey' ? ' — ' : ': ',
            words: [app.msgs.state_off.toUpperCase(), app.msgs.state_on.toUpperCase()]
        },
        register() {
            // Init prompt setting status labels
            const re_all = new RegExp(`^(${app.msgs.menuLabel_all}|all|any|every)`, 'i');
            app.settings.replyTopic.status = re_all.test(config.replyTopic) ? app.msgs.menuLabel_all : toTitleCase(config.replyTopic);
            app.settings.replyInterval.status = `${config.replyInterval}s`;

            // Add Infinity Mode toggle
            const imLabel = `${menu.state.symbols[+!!config.infinityMode]} ${app.msgs.menuLabel_infinityMode} ∞ ${menu.state.separator}${menu.state.words[+!!config.infinityMode]}`;
            menu.ids.push(GM_registerMenuCommand(imLabel, () => { document.getElementById('infinity-toggle-label').click(); }));

            // Add setting entries
            Object.keys(app.settings).forEach(key => {
                const settingIsEnabled = config[key] ^ /disabled|hidden/i.test(key);
                const menuLabel = `${app.settings[key].symbol || menu.state.symbols[+settingIsEnabled]} ${app.settings[key].label}${
                    app.settings[key].type === 'toggle' ? 
                    `${menu.state.separator}${menu.state.words[+settingIsEnabled]}` : 
                    `— ${app.settings[key].status}`
                }`;
                
                menu.ids.push(GM_registerMenuCommand(menuLabel, () => {
                    if (key === 'replyTopic') {
                        const replyTopic = prompt(`${app.msgs.prompt_updateReplyTopic} (${app.msgs.prompt_orEnter} 'ALL'):`, config.replyTopic);
                        if (replyTopic !== null) { // user didn't cancel
                            const str_replyTopic = replyTopic.toString();
                            settings.save('replyTopic', !replyTopic || re_all.test(str_replyTopic) ? 'ALL' : str_replyTopic);
                            if (isCodeInput(str_replyTopic)) {
                                startCodeImprovementMode(str_replyTopic);
                            } else {
                                siteAlert(`${app.msgs.alert_replyTopicUpdated}!`,
                                    `${app.msgs.appName} ${app.msgs.alert_willAnswer} ${
                                        !replyTopic || re_all.test(str_replyTopic) ?
                                        app.msgs.alert_onAllTopics :
                                        `${app.msgs.alert_onTopicOf} ${str_replyTopic}`
                                    }!`
                                );
                                if (config.infinityMode) { // restart session using new reply topic
                                    chatgpt.stop();
                                    document.getElementById('infinity-toggle-label').click(); // toggle off
                                    setTimeout(() => { document.getElementById('infinity-toggle-label').click(); }, 500); // toggle on
                                }
                            }
                        }
                    } else if (key === 'replyInterval') {
                        while (true) {
                            const replyInterval = prompt(`${app.msgs.prompt_updateReplyInt}:`, config.replyInterval);
                            if (replyInterval === null) break; // user cancelled so do nothing
                            else if (!isNaN(parseInt(replyInterval, 10)) && parseInt(replyInterval, 10) > 4) { // valid int set
                                settings.save('replyInterval', parseInt(replyInterval, 10));
                                siteAlert(`${app.msgs.alert_replyIntUpdated}!`, // title
                                    `${app.msgs.appName} ${app.msgs.alert_willReplyEvery} ${replyInterval} ${app.msgs.unit_seconds}.`); // msg
                                if (config.infinityMode) infinity.restart({ target: 'self' }); // using new reply interval                    
                                break;
                            }
                        }
                    } else { // save toggled state + notify
                        settings.save(key, !config[key]);
                        notify(`${app.settings[key].label}: ${menu.state.words[+(/disabled|hidden/i.test(key) ^ config[key])]}`);
                    }
                    syncStorageToUI();
                }));
            });

            // Add About entry
            const aboutLabel = `💡 ${app.msgs.menuLabel_about} ${app.msgs.appName}`;
            menu.ids.push(GM_registerMenuCommand(aboutLabel, modals.about.show));

            // Add Donate entry
            const donateLabel = `💖 ${app.msgs.menuLabel_donate}`;
            menu.ids.push(GM_registerMenuCommand(donateLabel, modals.donate.show));
        },
        refresh() {
            if (env.scriptManager === 'OrangeMonkey') return;
            menu.ids.forEach(id => GM_unregisterMenuCommand(id));
            menu.ids = [];
            menu.register();
        }
    };
    function isCodeInput(input) {
        const codePatterns = /[{};()=]|function|var|let|const|if|for|while/;
        return codePatterns.test(input);
    }

    function startCodeImprovementMode(code) {
        console.log("Starting code improvement mode for:", code);
        chatgpt.send(`Improve this code:\n\n${code}`);
        chatgpt.on('message', (message) => {
            console.log("New message received:", message);
            if (message.startsWith("") && message.endsWith("")) {
                const codeImprovement = message.slice(3, -3);
                applyCodeImprovement(codeImprovement);
            }
        });
    }

    function toTitleCase(str) {
        return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
    }

    function siteAlert(title, message) {
        console.log("Site Alert:", title, message);
        // Implement site alert UI here
        const alertElement = document.createElement('div');
        alertElement.className = 'site-alert';
        alertElement.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
        document.body.appendChild(alertElement);
        setTimeout(() => alertElement.remove(), 5000); // Remove after 5 seconds
    }

    function notify(message) {
        console.log("Notification:", message);
        // Implement notification UI here
        const notificationElement = document.createElement('div');
        notificationElement.className = 'notification';
        notificationElement.textContent = message;
        document.body.appendChild(notificationElement);
        setTimeout(() => notificationElement.remove(), 3000); // Remove after 3 seconds
    }

    function syncStorageToUI() {
        console.log("Syncing storage to UI");
        Object.entries(config).forEach(([key, value]) => {
            const element = document.getElementById(key);
            if (element) {
                if (element.type === 'checkbox') {
                    element.checked = value;
                } else if (element.tagName === 'SELECT') {
                    element.value = value;
                } else {
                    element.value = value;
                }
            }
        });
    }
    const infinity = {
        restart: function({ target, ...options }) {
            console.log("Restarting infinity mode with options:", options);
            clearTimeout(infinityTimer);
            Object.assign(config, options);
            saveConfig();
            startInfinityMode();
        }
    };

    const modals = {
        about: {
            show: function() {
                console.log("Showing About modal");
                const modal = createModal("About", `
                    <h2>About ${app.msgs.appName}</h2>
                    <p>${app.msgs.appDescription}</p>
                    <p>Version: ${app.version}</p>
                `);
                document.body.appendChild(modal);
            }
        },
        donate: {
            show: function() {
                console.log("Showing Donate modal");
                const modal = createModal("Donate", `
                    <h2>Donate</h2>
                    <p>If you find this app useful, please consider making a donation to support its development.</p>
                    <a href="${app.donationLink}" target="_blank" rel="noopener noreferrer">Donate Now</a>
                `);
                document.body.appendChild(modal);
            }
        }
    };

    function createModal(id, content) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                ${content}
                <button id="close${id}Modal">Close</button>
            </div>
        `;
        modal.querySelector(`#close${id}Modal`).addEventListener('click', () => {
            document.body.removeChild(modal);
        });
        return modal;
    }

    function applyCodeImprovement(codeImprovement) {
        console.log("Applying code improvement:", codeImprovement);
        try {
            new Function(codeImprovement)();
            notify("Code improvement applied successfully");
        } catch (error) {
            console.error("Error applying code improvement:", error);
            notify(`Failed to apply code improvement: ${error.message}`);
        }
    }

    function automatedCycle() {
        console.log("Running automated cycle");
        Promise.all([checkForNewMessages(), processPendingTasks()])
            .then(() => {
                infinityTimer = setTimeout(automatedCycle, config.replyInterval * 1000);
            })
            .catch(error => {
                console.error("Error in automated cycle:", error);
                infinityTimer = setTimeout(automatedCycle, config.replyInterval * 1000);
            });
    }

    async function checkForNewMessages() {
        console.log("Checking for new messages");
        try {
            const messages = await fetchNewMessages();
            if (messages.length > 0) {
                messages.forEach(message => processMessage(message));
            }
        } catch (error) {
            console.error("Error checking for new messages:", error);
        }
    }

    async function processPendingTasks() {
        console.log("Processing pending tasks");
        const pendingTasks = getPendingTasks();
        for (const task of pendingTasks) {
            try {
                await executeTask(task);
                markTaskAsCompleted(task.id);
            } catch (error) {
                console.error("Error processing task:", error);
                markTaskAsFailed(task.id, error.message);
            }
        }
    }

    let infinityTimer;
    function startInfinityMode() {
        console.log("Starting infinity mode");
        automatedCycle();
    }

    function saveConfig() {
        localStorage.setItem('appConfig', JSON.stringify(config));
        console.log("Config saved");
    }

    // Helper functions (to be implemented or imported from other modules)
    async function fetchNewMessages() {
        try {
            const response = await fetch('/api/messages');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error("Error fetching messages:", error);
            return [];
        }
    }

    function processMessage(message) {
        console.log("Processing message:", message);
        const messageHandlers = {
            task: addTask,
            notification: notify,
            email: sendEmail,
            reminder: setReminder
        };

        const handler = messageHandlers[message.type];
        if (handler) {
            handler(message.content);
        } else {
            console.log("Unknown message type:", message.type);
        }
    }

    function addTask(content) {
        console.log("Adding task:", content);
        const task = {
            id: Date.now(),
            content: content,
            status: 'pending'
        };
        tasks.push(task);
        updateTaskList();
        saveTasks();
    }

    function notify(content) {
        console.log("Sending notification:", content);
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    new Notification('New Notification', { body: content });
                }
            });
        }
        displayNotification(content);
    }

    function displayNotification(content) {
        const notificationElement = document.createElement('div');
        notificationElement.className = 'notification';
        notificationElement.textContent = content;
        document.body.appendChild(notificationElement);
        setTimeout(() => notificationElement.remove(), 5000);
    }

    function sendEmail(content) {
        console.log("Sending email:", content);
        fetch('/api/send-email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content: content })
        })
        .then(response => response.json())
        .then(data => console.log('Email sent:', data))
        .catch(error => console.error('Error sending email:', error));
    }

    function setReminder(content) {
        console.log("Setting reminder:", content);
        const reminder = {
            id: Date.now(),
            content: content,
            timestamp: new Date().toISOString()
        };
        reminders.push(reminder);
        scheduleReminder(reminder);
        saveReminders();
    }

    function updateTaskList() {
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        tasks.forEach(task => {
            const li = document.createElement('li');
            li.textContent = task.content;
            li.dataset.id = task.id;
            li.dataset.status = task.status;
            if (task.status === 'completed') {
                li.classList.add('completed');
            } else if (task.status === 'failed') {
                li.classList.add('failed');
                const errorSpan = document.createElement('span');
                errorSpan.className = 'error-message';
                errorSpan.textContent = task.errorMessage || 'Unknown error';
                li.appendChild(errorSpan);
            }
            taskList.appendChild(li);
        });
    }

    function scheduleReminder(reminder) {
        const now = new Date();
        const reminderTime = new Date(reminder.timestamp);
        const delay = reminderTime.getTime() - now.getTime();
        
        if (delay > 0) {
            setTimeout(() => {
                notify(reminder.content);
            }, delay);
        } else {
            console.log('Reminder time has already passed:', reminder.content);
            notify(`Overdue reminder: ${reminder.content}`);
        }
    }

    let tasks = [];
    let reminders = [];

    function getPendingTasks() {
        return tasks.filter(task => task.status === 'pending');
    }

    function saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function saveReminders() {
        localStorage.setItem('reminders', JSON.stringify(reminders));
    }

    function loadTasks() {
        const storedTasks = localStorage.getItem('tasks');
        tasks = storedTasks ? JSON.parse(storedTasks) : [];
    }

    function loadReminders() {
        const storedReminders = localStorage.getItem('reminders');
        reminders = storedReminders ? JSON.parse(storedReminders) : [];
        reminders.forEach(scheduleReminder);
    }

    // Initialize tasks and reminders
    loadTasks();
    loadReminders();

    function executeTask(task) {
        console.log("Executing task:", task);
        return new Promise((resolve, reject) => {
            switch (task.type) {
                case 'email':
                    sendEmail(task.recipient, task.subject, task.content)
                        .then(() => resolve('Email sent successfully'))
                        .catch(error => reject(error));
                    break;
                case 'reminder':
                    setReminder(task.time, task.content);
                    resolve('Reminder set successfully');
                    break;
                default:
                    reject(new Error(`Unknown task type: ${task.type}`));
            }
        });
    }

    function addTask(task) {
        task.id = Date.now();
        task.status = 'pending';
        tasks.push(task);
        saveTasks();
        updateTaskList();
    }

    function sendEmail(recipient, subject, body) {
        console.log(`Sending email to ${recipient} with subject: ${subject}`);
        return emailService.send(recipient, subject, body);
    }

    function setReminder(time, message) {
        console.log(`Setting reminder for ${time}: ${message}`);
        const reminderTime = new Date(time);
        const reminder = { id: Date.now(), timestamp: reminderTime, content: message };
        reminders.push(reminder);
        scheduleReminder(reminder);
        saveReminders();
    }

    function markTaskAsCompleted(taskId) {
        const taskIndex = tasks.findIndex(task => task.id === taskId);
        if (taskIndex !== -1) {
            tasks[taskIndex].status = 'completed';
            updateTaskList();
            saveTasks();
        }
    }

    const emailService = {
        send: function(recipient, subject, body) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (Math.random() > 0.1) {
                        resolve('Email sent successfully');
                    } else {
                        reject(new Error('Failed to send email'));
                    }
                }, 1000);
            });
        }
    };

    function markTaskAsFailed(taskId, errorMessage) {
        const taskIndex = tasks.findIndex(task => task.id === taskId);
        if (taskIndex !== -1) {
            tasks[taskIndex].status = 'failed';
            tasks[taskIndex].errorMessage = errorMessage;
            updateTaskList();
            saveTasks();
        }
    }

    function checkForNewMessages() {
        console.log("Checking for new messages");
        chatgpt.on('message', (message) => {
            console.log("New message received:", message);
            if (message.startsWith("") && message.endsWith("")) {
                const codeImprovement = message.substring(3, message.lastIndexOf("```"));
                applyCodeImprovement(codeImprovement);
            }
        });
    }

    async function processPendingTasks() {
        console.log("Processing pending tasks");
        const pendingTasks = getPendingTasks();
        for (const task of pendingTasks) {
            await executeTask(task);
        }
        await updateTaskStatus();
    }

    async function executeTask(task) {
        console.log("Executing task:", task);
        try {
            let result;
            switch (task.type) {
                case 'codeReview':
                    result = await startCodeImprovementMode(task.code);
                    break;
                case 'bugFix':
                    result = await chatgpt.send(`Fix this bug: ${task.description}`);
                    break;
                case 'featureImplementation':
                    result = await chatgpt.send(`Implement this feature: ${task.description}`);
                    break;
                case 'email':
                    result = await sendEmail(task.recipient, task.subject, task.content);
                    break;
                case 'reminder':
                    setReminder(task.time, task.content);
                    result = 'Reminder set successfully';
                    break;
                default:
                    throw new Error(`Unknown task type: ${task.type}`);
            }
            await markTaskAsCompleted(task.id, result);
        } catch (error) {
            await markTaskAsFailed(task.id, error.message);
        }
    }

    async function updateTaskStatus() {
        console.log("Updating task statuses");
        const processedTasks = getProcessedTasks();
        for (const task of processedTasks) {
            await updateTaskInDatabase(task);
        }
        await notifyTaskCompletion(processedTasks);
    }

    function getProcessedTasks() {
        return tasks.filter(task => task.status !== 'pending');
    }

    async function updateTaskInDatabase(task) {
        console.log(`Updating task ${task.id} in database. Status: ${task.status}`);
        await chatgpt.db.update('tasks', task.id, {
            status: task.status,
            result: task.result
        });
    }

    async function notifyTaskCompletion(processedTasks) {
        console.log("Notifying task completion");
        for (const task of processedTasks) {
            if (task.status === 'completed') {
                console.log(`Task ${task.id} completed. Result: ${task.result}`);
                await chatgpt.notify(`Task ${task.id} completed`, task.result);
            } else if (task.status === 'failed') {
                console.log(`Task ${task.id} failed. Error: ${task.errorMessage}`);
                await chatgpt.notify(`Task ${task.id} failed`, task.errorMessage);
            }
        }
    }

