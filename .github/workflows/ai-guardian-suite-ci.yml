name: ai-guardian-suite-ci

on:
  push:
    paths:
      - 'ai-chat-websites/Userscripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'ai-chat-websites/Userscripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Suite CI — install → build:bundle → check:suite → validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: "ai-chat-websites/Userscripts/AI Chat Userscript Studio/Userscript Suite"
    steps:
      - uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "ai-chat-websites/Userscripts/AI Chat Userscript Studio/Userscript Suite/package-lock.json"

      - name: npm ci (retry on rate_limit / network)
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $i); backoff $((i * 15))s"
            sleep $((i * 15))
          done
          echo "npm ci failed after retries; trying npm install"
          npm install --no-audit --no-fund

      - name: build:bundle (dense bundle contracts)
        run: npm run build:bundle

      - name: check:suite (all eight harnesses)
        run: npm run check:suite

      - name: validate (all userscripts parse)
        run: npm run validate

      - name: test (node:test runner, dependency-free)
        run: npm test
