name: Workflow Lint

# Enforces the workspace rule: every GitHub Actions workflow must pass
# `actionlint` before it lands. Runs whenever any workflow file changes.
on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

# Overlapping lint runs are pure duplication - a newer push re-lints the same
# paths, so let it cancel the older run instead of queueing behind it.
concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # WF003 fix: never pipe a downloaded script into a shell. Fetch the release
      # asset itself and verify its SHA256 against a value pinned here, so a
      # retagged upstream (or a compromised download mirror) cannot run code as
      # this repo. The hash is from actionlint_1.7.7_checksums.txt, linux/amd64.
      - name: Install actionlint from a checksum-verified release asset
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          curl -sSfL -o "/tmp/${asset}" "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/${asset}" | sha256sum --check --strict
          tar -xzf "/tmp/${asset}" -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint all workflow files
        run: |
          set -euo pipefail
          actionlint -color -oneline
          echo "All workflows passed actionlint."
