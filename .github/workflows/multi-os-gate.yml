name: Multi-OS Gate Spot-Check

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/multi-os-gate.yml'
  schedule:
    - cron: '0 4 * * 6' # Saturdays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install root dev dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check workspace Node tools (both OS)
        run: |
          node --check tools/bundle-trend.cjs
          node --check tools/e2e-smoke.mjs
          node --check tools/extension-check.mjs
          node --check tools/handoff-check.mjs
          node --check tools/load-test.mjs
          node --check tools/check-doc-links.mjs
          node --check tools/secret-scan.mjs
          node --check tools/sync-parity.mjs
      - name: Doc-link health (all Markdown)
        run: node tools/check-doc-links.mjs
      - name: Extension health (informational — ladder surface may lag)
        continue-on-error: true
        run: node tools/extension-check.mjs --quiet
      - name: Secret scan (offline twin of secret-scan.yml)
        run: |
          node tools/secret-scan.mjs --quiet
          node tools/secret-scan.mjs --check-ci
      - name: Handoff schema check (skips when machine-local state is absent)
        run: node tools/handoff-check.mjs --quiet
      - name: Fleet parity (skipped automatically when standalone clones are absent)
        if: runner.os == 'Windows'
        run: node tools/sync-parity.mjs check --strict
      - name: OPS dashboard smoke (both OS)
        run: node tools/ops-dashboard.mjs --out docs/metrics/OPS-DASHBOARD.md
      - name: Upload OPS dashboard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ops-dashboard
          path: docs/metrics/OPS-DASHBOARD.md
          if-no-files-found: ignore
      - name: Workspace gate (Windows - hard gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run gate
      - name: Workspace gate (Linux - informational spot-check)
        if: runner.os == 'Linux'
        shell: pwsh
        continue-on-error: true
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/workspace-gate.ps1
