name: Multi-OS Gate Spot-Check

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/multi-os-gate.yml'
  schedule:
    - cron: '0 4 * * 6' # Saturdays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install root dev dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check workspace Node tools (both OS)
        run: |
          node --check tools/bundle-trend.cjs
          node --check tools/e2e-smoke.mjs
          node --check tools/extension-check.mjs
          node --check tools/handoff-check.mjs
          node --check tools/load-test.mjs
          node --check tools/check-doc-links.mjs
          node --check tools/check-doc-facts.mjs
          node --check tools/check-flag-contract.mjs
          node --check tools/secret-scan.mjs
          node --check tools/sync-parity.mjs
      - name: Doc-link health (all Markdown)
        run: node tools/check-doc-links.mjs
      # Complements the link check above: links prove a doc PATH is real, this
      # proves a doc NUMBER is still true. It caught six stale "--check-cli 19/19"
      # claims across three files on 2026-10-01, and immediately caught its own
      # addition (adding this tool moved the live total 21 -> 22). Totals are
      # derived from the filesystem and check-flag-contract --json, never hand-typed.
      - name: Doc facts (documented counts still match runtime truth)
        run: node tools/check-doc-facts.mjs
      - name: Extension health (informational — ladder surface may lag)
        continue-on-error: true
        run: node tools/extension-check.mjs --quiet
      - name: Secret scan (offline twin of secret-scan.yml)
        run: |
          node tools/secret-scan.mjs --quiet
          node tools/secret-scan.mjs --check-ci
      - name: Handoff schema check (skips when machine-local state is absent)
        run: node tools/handoff-check.mjs --quiet
      - name: Fleet parity (skipped automatically when standalone clones are absent)
        if: runner.os == 'Windows'
        run: node tools/sync-parity.mjs check --strict
      - name: Tool CLI contract - every tool answers --help and rejects unknown flags
        run: node tools/verify-tools.mjs --check-cli --quiet
      # --deep adds the behavioural layer: it probes each DECLARED flag to confirm the
      # tool implements it, and specifically proves the `--flag=value` form of the
      # Round 12 D contract works (the only check that does - --check-cli proves
      # unknown-flag rejection, the static layer proves declared == documented).
      # Verified green fleet-wide (20/20) and side-effect free: probes run with a
      # sentinel value, write-risky flags (--out/--ledger) are skipped unless
      # --allow-write-risky, and a run leaves no tracked or untracked artifact.
      # Costs ~40s. Drop `--deep` from this line to fall back to the static layer only.
      - name: Flag contract - declared flags are implemented, --flag=value works
        run: node tools/check-flag-contract.mjs --deep --quiet
      - name: Tool self-tests - guard matrix and classifier logic
        run: node tools/verify-tools.mjs --self-test
      # The remaining self-test suite, all read-only (fixtures live in a temp dir;
      # verified to leave the working tree byte-identical). These previously gated
      # only via the local `npm run tools:selftest` chain, so a regression in any
      # of them could merge silently. Kept on BOTH OS runners on purpose:
      # handoff-check's UTF-8 BOM tolerance and secret-scan's line decoding are
      # exactly the class of defect that only appears on one platform (PowerShell
      # writes BOMs on Windows). ~13s total against a 25-minute job budget.
      - name: Tool self-tests - detectors, schema validator, telemetry pipeline
        run: |
          node tools/secret-scan.mjs --self-test
          node tools/handoff-check.mjs --self-test
          node tools/workflow-audit.mjs --self-test
          node tools/check-flag-contract.mjs --self-test
          # check-doc-facts' self-test is the ONLY place the flagTotal invariant
          # is verified against the real tool; the hot path derives it for speed.
          # Without this line the speedup could rot unnoticed in CI.
          node tools/check-doc-facts.mjs --self-test
          node tools/telemetry-collector.mjs --self-test
          node tools/telemetry-export.mjs --self-test
      - name: OPS dashboard smoke (both OS)
        run: node tools/ops-dashboard.mjs --out docs/metrics/OPS-DASHBOARD.md
      - name: Upload OPS dashboard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ops-dashboard
          path: docs/metrics/OPS-DASHBOARD.md
          if-no-files-found: ignore
      - name: Workspace gate (Windows - hard gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run gate
      - name: Workspace gate (Linux - informational spot-check)
        if: runner.os == 'Linux'
        shell: pwsh
        continue-on-error: true
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/workspace-gate.ps1
