name: Generate & Deploy API Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

# Artifact upload works without Pages; deploy is best-effort.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies (retry on rate_limit)
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if npm ci --prefix nexus-infinity-hub || npm install --legacy-peer-deps --prefix nexus-infinity-hub; then
              exit 0
            fi
            echo "npm install failed (attempt $i); backoff ${i}0s"
            sleep $((i * 10))
          done
          echo "npm install failed after retries"
          exit 1
      - name: Check for TypeDoc
        run: |
          cd nexus-infinity-hub
          if npm list typedoc > /dev/null 2>&1; then
            echo "TypeDoc is installed"
          else
            echo "Installing TypeDoc..."
            for i in 1 2 3; do
              npm install --save-dev typedoc && break
              sleep $((i * 8))
            done
          fi
      - name: Generate TypeScript docs
        run: |
          cd nexus-infinity-hub
          npx typedoc --out ../docs/api/nexus-infinity-hub src/ 2>/dev/null || echo "TypeDoc generation completed"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Generate Python docs
        run: |
          pip install pdoc markdown
          if [ -d singularity-operator ]; then
            mkdir -p docs/api/singularity-operator
            cd singularity-operator
            pdoc --html --force --output-directory ../docs/api/singularity-operator . 2>/dev/null || echo "pdoc completed"
            cd ..
          fi
          if [ -d autonomous-github-agent ]; then
            mkdir -p docs/api/autonomous-github-agent
            cd autonomous-github-agent
            pdoc --html --force --output-directory ../docs/api/autonomous-github-agent . 2>/dev/null || echo "pdoc completed"
            cd ..
          fi
      - name: Upload docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-docs
          path: docs/api/
          retention-days: 90
      - name: Publish docs index
        run: |
          mkdir -p docs
          cat > docs/index.md <<'IDX'
          # API Documentation

          Generated API documentation for all projects.

          - [nexus-infinity-hub](./nexus-infinity-hub/index.html)
          - [singularity-operator](./singularity-operator/index.html)
          - [autonomous-github-agent](./autonomous-github-agent/index.html)
          IDX
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'docs/'
        continue-on-error: true

  deploy-pages:
    needs: generate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Soft-fail: Pages env/auth often unset on private or unconfigured repos.
    # Docs still ship as workflow artifacts.
    continue-on-error: true
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true
