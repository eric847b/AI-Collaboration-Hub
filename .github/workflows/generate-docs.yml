name: Generate & Deploy API Docson:  push:    branches: [main]  workflow_dispatch:jobs:  generate-docs:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - name: Setup Node        uses: actions/setup-node@v4        with:          node-version: '20'          cache: 'npm'          cache-dependency-path: nexus-infinity-hub/package-lock.json      - name: Install dependencies        run: npm ci --prefix nexus-infinity-hub      - name: Check for TypeDoc        run: |          cd nexus-infinity-hub          if npm list typedoc > /dev/null 2>&1; then            echo "TypeDoc is installed"          else            echo "Installing TypeDoc..."            npm install --save-dev typedoc          fi      - name: Generate TypeScript docs        run: |          cd nexus-infinity-hub          npx typedoc --out ../docs/api/nexus-infinity-hub src/ 2>/dev/null || echo "TypeDoc generation completed"      - name: Setup Python        uses: actions/setup-python@v5        with:          python-version: '3.12'      - name: Generate Python docs        run: |          pip install pdoc markdown                    # singularity-operator          if [ -d singularity-operator ]; then            mkdir -p docs/api/singularity-operator            cd singularity-operator            pdoc --html --force --output-directory ../docs/api/singularity-operator . 2>/dev/null || echo "pdoc completed"            cd ..          fi                    # autonomous-github-agent          if [ -d autonomous-github-agent ]; then            mkdir -p docs/api/autonomous-github-agent            cd autonomous-github-agent            pdoc --html --force --output-directory ../docs/api/autonomous-github-agent . 2>/dev/null || echo "pdoc completed"            cd ..          fi      - name: Upload docs artifacts        uses: actions/upload-artifact@v4        with:          name: api-docs          path: docs/api/          retention-days: 90      - name: Publish docs index        run: |          cat > docs/index.md <<'EOF'          # API Documentation                    Generated API documentation for all projects.                    - [nexus-infinity-hub](./nexus-infinity-hub/index.html)          - [singularity-operator](./singularity-operator/index.html)          - [autonomous-github-agent](./autonomous-github-agent/index.html)          EOF      - name: Deploy to GitHub Pages        uses: actions/upload-pages-artifact@v3        with:          path: 'docs/'        continue-on-error: true  deploy-pages:    needs: generate-docs    runs-on: ubuntu-latest    if: github.ref == 'refs/heads/main'    permissions:      pages: write      id-token: write    environment:      name: github-pages      url: ${{ steps.deployment.outputs.page_url }}    steps:      - name: Deploy to GitHub Pages        id: deployment        uses: actions/deploy-pages@v4