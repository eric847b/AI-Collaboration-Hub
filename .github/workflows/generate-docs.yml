name: Generate & Deploy API Docs

# Docs generation is free and always useful (artifacts).
# GitHub Pages deploy is optional: if Pages is not enabled under
# Settings → Pages, deploy-pages returns 404 — that must not fail CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nexus-infinity-hub/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix nexus-infinity-hub || npm install --prefix nexus-infinity-hub

      - name: Check for TypeDoc
        run: |
          cd nexus-infinity-hub
          if npm list typedoc > /dev/null 2>&1; then
            echo "TypeDoc is installed"
          else
            echo "Installing TypeDoc..."
            npm install --save-dev typedoc
          fi

      - name: Generate TypeScript docs
        run: |
          cd nexus-infinity-hub
          npx typedoc --out ../docs/api/nexus-infinity-hub src/ 2>/dev/null || echo "TypeDoc generation completed"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate Python docs
        run: |
          pip install pdoc markdown

          if [ -d singularity-operator ]; then
            mkdir -p docs/api/singularity-operator
            cd singularity-operator
            pdoc --html --force --output-directory ../docs/api/singularity-operator . 2>/dev/null || echo "pdoc completed"
            cd ..
          fi

          if [ -d autonomous-github-agent ]; then
            mkdir -p docs/api/autonomous-github-agent
            cd autonomous-github-agent
            pdoc --html --force --output-directory ../docs/api/autonomous-github-agent . 2>/dev/null || echo "pdoc completed"
            cd ..
          fi

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/api/
          retention-days: 90
          if-no-files-found: ignore

      - name: Publish docs index
        run: |
          mkdir -p docs
          cat > docs/index.md <<'EOF'
          # API Documentation

          Generated API documentation for all projects.

          - [nexus-infinity-hub](./api/nexus-infinity-hub/index.html)
          - [singularity-operator](./api/singularity-operator/index.html)
          - [autonomous-github-agent](./api/autonomous-github-agent/index.html)
          EOF

      - name: Upload Pages artifact (optional)
        id: pages_artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/'

  deploy-pages:
    needs: generate-docs
    runs-on: ubuntu-latest
    # Only attempt when generate uploaded a pages artifact; never fail the workflow
    # if GitHub Pages is disabled (deploy-pages → 404 Not Found).
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
