name: Lint AutoFix

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [nexus-infinity-hub, self-evolve-dash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: '${{ matrix.project }}/package-lock.json'

      - name: Install dependencies (retry on rate_limit)
        working-directory: ${{ matrix.project }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if npm ci --prefer-offline; then
              exit 0
            fi
            echo "npm ci failed (attempt $i); backoff ${i}0s"
            sleep $((i * 10))
          done
          echo "npm ci failed after retries"
          exit 1

      - name: Run ESLint autofix
        working-directory: ${{ matrix.project }}
        run: npm run lint:fix || true

      - name: Commit and push fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add -A
            git commit -m 'ci: lint autofix (${{ matrix.project }})' || true
            git push
          fi
