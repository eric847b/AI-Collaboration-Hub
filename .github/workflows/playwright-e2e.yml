name: E2E (Playwright)

on:
  pull_request:
    paths:
      - 'nexus-infinity-hub/**'
      - 'self-evolve-dash/**'
      - '.github/workflows/playwright-e2e.yml'
  schedule:
    - cron: '0 5 * * 6' # Saturdays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [nexus-infinity-hub, self-evolve-dash]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install and build (${{ matrix.project }})
        run: |
          cd ${{ matrix.project }}
          for i in 1 2 3; do
            if npm ci || npm install --legacy-peer-deps; then break; fi
            if [ "$i" = "3" ]; then exit 1; fi
            sleep $((i * 10))
          done
          npm run build
      - name: Install Playwright chromium
        run: |
          cd ${{ matrix.project }}
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e --prefix ${{ matrix.project }}
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: ${{ matrix.project }}/playwright-report/
          retention-days: 14
