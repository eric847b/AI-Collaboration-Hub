name: OPS Dashboard Refresh

on:
  schedule:
    - cron: "0 4 * * *"  # Daily at 4:00 AM UTC
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - "docs/**"
      - "tools/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

# Prevent duplicate runs
concurrency:
  group: ops-dashboard-refresh
  # Deliberately cancel-in-progress: false (fleet convention for scheduled flows —
  # never kill a mid-run dashboard refresh; duplicate triggers just queue up).

permissions:
  contents: write  # For committing dashboard updates
  # No other permissions needed

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history for proper commits

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'  # Match workspace engines requirement (Node ≥26)
          cache: "npm"

      - name: Install Dependencies
        run: npm ci  # Use lockfile for reproducible installs

      - name: Run Workspace Gate
        run: npm run gate

      - name: Regenerate OPS Dashboard
        run: node tools/ops-dashboard.mjs --refresh

      - name: Verify Dashboard Freshness
        run: node tools/ops-dashboard.mjs --check

      - name: Check for Changes
        id: changes
        run: |
          git add docs/metrics/OPS-DASHBOARD.md
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Updates
        if: steps.changes.outputs.changed == 'true'
        run: |-
          git config user.name "CI Bot"
          git config user.email "ci@users.noreply.github.com"
          git commit -m "docs: auto-refresh OPS Dashboard"

      - name: Push Changes
        if: steps.changes.outputs.changed == 'true'
        run: git push

      - name: Notify on Manual Dispatch
        if: github.event_name == 'workflow_dispatch' && steps.changes.outputs.changed == 'true'
        run: |
          echo "::notice title=OPS Dashboard Refreshed::Dashboard has been updated in commit ${{ github.sha }}"
