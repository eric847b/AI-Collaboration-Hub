name: Lockfile Validation

# npm-canonical policy: package-lock.json required when deps exist.
# yarn/pnpm/bun locks alone do not satisfy the gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Discover and validate Node lockfiles (npm-canonical)
        run: |
          set -e
          echo "Scanning monorepo for package.json projects (npm-canonical)..."
          FAIL=0
          WARN=0
          while IFS= read -r -d '' pkg; do
            dir=$(dirname "$pkg")
            case "$dir" in
              *node_modules*|*Archive*|*.git*|*dist*|*build*|*/archive/*|*Userscripts*) continue ;;
            esac

            has_deps=0
            if python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if (d.get('dependencies') or d.get('devDependencies') or d.get('optionalDependencies')) else 1)" "$pkg" 2>/dev/null; then
              has_deps=1
            fi

            has_npm_lock=0
            if [ -f "$dir/package-lock.json" ]; then
              has_npm_lock=1
            fi

            alt=""
            for lf in pnpm-lock.yaml yarn.lock bun.lockb bun.lock; do
              if [ -f "$dir/$lf" ]; then
                alt="$alt $lf"
              fi
            done

            if [ "$has_npm_lock" -eq 1 ]; then
              echo "✓ $dir: package-lock.json present"
              if [ -n "$alt" ]; then
                echo "  ⚠ also has non-npm locks:$alt (prefer remove; npm is canonical)"
                WARN=1
              fi
            elif [ "$has_deps" -eq 1 ]; then
              echo "❌ Missing package-lock.json under: $dir (has dependencies; npm-canonical)"
              if [ -n "$alt" ]; then
                echo "  found non-npm locks:$alt — run npm install and commit package-lock.json"
              fi
              FAIL=1
            else
              echo "⚠ $dir: no lockfile (no deps — advisory only)"
              WARN=1
            fi
          done < <(find . -name package.json -print0 2>/dev/null)

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more Node projects with dependencies lack package-lock.json (npm-canonical)."
            exit 1
          fi
          echo "All dependency-bearing Node projects have package-lock.json. (warnings=$WARN)"

      - name: Check Python requirements (advisory)
        run: |
          echo "Scanning for Python projects..."
          for proj in singularity-operator autonomous-github-agent solutions-dynamics; do
            if [ -d "$proj" ]; then
              if [ -f "$proj/requirements.txt" ] || [ -f "$proj/pyproject.toml" ]; then
                echo "✓ $proj: requirements present"
              else
                echo "⚠ $proj: missing requirements.txt (recommended)"
              fi
            fi
          done

      - name: Summary
        run: |
          echo "Workflow YAML files:"
          find .github/workflows -maxdepth 1 -name '*.yml' -printf '%f\n' 2>/dev/null | wc -l
          echo "Lockfile validation complete (npm-canonical)."
