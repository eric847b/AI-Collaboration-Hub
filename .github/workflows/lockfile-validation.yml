name: Lockfile Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  validate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover and validate Node lockfiles
        run: |
          set -e
          echo "Scanning monorepo for package.json projects..."
          FAIL=0
          WARN=0
          while IFS= read -r -d '' pkg; do
            dir=$(dirname "$pkg")
            case "$dir" in
              *node_modules*|*Archive*|*.git*|*dist*|*build*|*/archive/*) continue ;;
            esac

            # Only require lockfile when package has real dependencies
            has_deps=0
            if python3 -c "
import json,sys
try:
  d=json.load(open(sys.argv[1]))
  deps=d.get('dependencies') or {}
  dev=d.get('devDependencies') or {}
  opt=d.get('optionalDependencies') or {}
  sys.exit(0 if (deps or dev or opt) else 1)
except Exception:
  sys.exit(0)
" "$pkg" 2>/dev/null; then
              has_deps=1
            fi

            has_lock=0
            for lf in package-lock.json pnpm-lock.yaml yarn.lock bun.lockb bun.lock; do
              if [ -f "$dir/$lf" ]; then
                has_lock=1
                break
              fi
            done

            if [ "$has_lock" -eq 1 ]; then
              echo "✓ $dir: lockfile present"
            elif [ "$has_deps" -eq 1 ]; then
              echo "❌ Missing lockfile under: $dir (has dependencies)"
              FAIL=1
            else
              echo "⚠ $dir: no lockfile (no deps — advisory only)"
              WARN=1
            fi
          done < <(find . -name package.json -print0 2>/dev/null)

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more Node projects with dependencies lack a lockfile. Run npm/pnpm/yarn install and commit the lockfile."
            exit 1
          fi
          echo "All dependency-bearing Node projects have lockfiles. (warnings=$WARN)"

      - name: Check Python requirements (advisory)
        run: |
          echo "Scanning for Python projects..."
          for proj in singularity-operator autonomous-github-agent solutions-dynamics; do
            if [ -d "$proj" ]; then
              if [ -f "$proj/requirements.txt" ] || [ -f "$proj/pyproject.toml" ]; then
                echo "✓ $proj: requirements present"
              else
                echo "⚠ $proj: missing requirements.txt (recommended)"
              fi
            fi
          done

      - name: Summary
        run: |
          echo "Workflow YAML files:"
          ls -1 .github/workflows/*.yml 2>/dev/null | wc -l
          echo "Lockfile validation complete."
