name: E2E Smoke (preview builds)

on:
  push:
    branches: [main]
    paths:
      - 'nexus-infinity-hub/**'
      - 'self-evolve-dash/**'
      - 'tools/e2e-smoke.mjs'
      - '.github/workflows/e2e-smoke.yml'
  pull_request:
    paths:
      - 'nexus-infinity-hub/**'
      - 'self-evolve-dash/**'
      - 'tools/e2e-smoke.mjs'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      HUSKY: "0"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    strategy:
      fail-fast: false
      matrix:
        project: [nexus-infinity-hub, self-evolve-dash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install (${{ matrix.project }})
        run: |
          cd ${{ matrix.project }}
          # Prefer npm install when lock is out of sync with package.json (dash pin changes)
          for i in 1 2 3 4 5; do
            if [ -f package-lock.json ]; then
              if npm ci --prefer-offline; then exit 0; fi
            fi
            if npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund; then exit 0; fi
            echo "install failed attempt $i; backoff $((i * 20))s"
            sleep $((i * 20))
          done
          exit 1
      - name: Build
        run: npm run build --prefix ${{ matrix.project }}
      - name: Smoke test served build
        run: node tools/e2e-smoke.mjs --project ${{ matrix.project }}
      - name: Load test served build (gates - error rate and p95)
        run: node tools/load-test.mjs --project ${{ matrix.project }} --requests 300 --concurrency 15 --max-error-rate 1 --max-p95-ms 3000
