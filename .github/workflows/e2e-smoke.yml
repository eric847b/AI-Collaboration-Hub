name: E2E Smoke (preview builds)

on:
  push:
    branches: [main]
    paths:
      - 'nexus-infinity-hub/**'
      - 'self-evolve-dash/**'
      - 'tools/e2e-smoke.mjs'
      - '.github/workflows/e2e-smoke.yml'
  pull_request:
    paths:
      - 'nexus-infinity-hub/**'
      - 'self-evolve-dash/**'
      - 'tools/e2e-smoke.mjs'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [nexus-infinity-hub, self-evolve-dash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install (${{ matrix.project }}, retry on rate_limit)
        run: |
          cd ${{ matrix.project }}
          for i in 1 2 3; do
            if npm ci || npm install --legacy-peer-deps; then break; fi
            if [ "$i" = "3" ]; then exit 1; fi
            sleep $((i * 10))
          done
      - name: Build
        run: npm run build --prefix ${{ matrix.project }}
      - name: Smoke test served build
        run: node tools/e2e-smoke.mjs --project ${{ matrix.project }}
      - name: Load test served build (gates - error rate and p95)
        run: node tools/load-test.mjs --project ${{ matrix.project }} --requests 300 --concurrency 15 --max-error-rate 1 --max-p95-ms 3000
