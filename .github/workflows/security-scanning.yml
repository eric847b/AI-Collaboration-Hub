name: Security Scanning
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Dependabot Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
        with:
          project: 'AI Collaboration Hub'
          path: '.'
          format: 'JSON'
          args: >
            --enableExperimental
            --enableRetired
      - name: Upload results to Dependency-Check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-check-report
          path: |
            reports/
            **/dependency-check-report.json
          retention-days: 30
          if-no-files-found: ignore
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Audit npm dependencies
        run: |
          echo "Auditing npm dependencies..."
          npm audit --audit-level=moderate || true
          echo "Audit complete"
  python-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check for known vulnerabilities in Python
        run: |
          pip install safety
          safety check --json > safety-report.json || true
          echo "Python safety check complete"
      - name: Upload safety report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-safety-report
          path: safety-report.json
          retention-days: 30
          if-no-files-found: ignore
