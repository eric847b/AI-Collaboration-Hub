name: CollabHub Modules — FreeAI Rotator

# Protects the free-AI rotator (core + userscript + ESM façade) with the same
# offline gate used locally: `npm test` => 8 core + 10 userscript DOM + 13 ESM
# checks (31 total).
on:
  push:
    paths:
      - 'collabhub-modules/**'
  pull_request:
    paths:
      - 'collabhub-modules/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Run FreeAI rotator test gate (core + userscript + ESM façade)
        run: npm --prefix collabhub-modules test
      - name: Run offline failover smoke test (local-proof.js)
        run: npm --prefix collabhub-modules run test:local
