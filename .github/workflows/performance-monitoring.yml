name: Performance Monitoring

on:
  push:
    branches: [main]
    paths:
      - 'nexus-infinity-hub/src/**'
      - 'nexus-infinity-hub/public/**'
      - 'nexus-infinity-hub/package.json'
      - 'self-evolve-dash/src/**'
      - 'self-evolve-dash/public/**'
      - 'self-evolve-dash/package.json'
      - 'tools/bundle-trend.cjs'
      - 'docs/metrics/bundle-history.json'
      - '.github/workflows/performance-monitoring.yml'
  pull_request:
    paths:
      - 'nexus-infinity-hub/src/**'
      - 'nexus-infinity-hub/package.json'
      - 'self-evolve-dash/src/**'
      - 'self-evolve-dash/package.json'
      - 'tools/bundle-trend.cjs'
      - '.github/workflows/performance-monitoring.yml'
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      HUSKY: "0"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            nexus-infinity-hub/package-lock.json
            self-evolve-dash/package-lock.json
      - name: Install and build nexus-infinity-hub
        run: |
          cd nexus-infinity-hub
          for i in 1 2 3 4 5; do
            if npm ci --prefer-offline || npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund; then
              npm run build
              exit 0
            fi
            sleep $((i * 20))
          done
          exit 1
      - name: Install and build self-evolve-dash
        run: |
          cd self-evolve-dash
          for i in 1 2 3 4 5; do
            if npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund; then
              npm run build
              exit 0
            fi
            sleep $((i * 20))
          done
          exit 1
      - name: Regression gate vs committed baseline
        run: node tools/bundle-trend.cjs check --threshold 10
        env:
          # Optional webhook for bundle-regression alerts (e.g. Slack/Discord).
          # Unset/empty -> the tool emits only ::error:: annotations. Scoped to
          # this step deliberately: workflow-level secret env trips WF012.
          BUNDLE_ALERT_WEBHOOK: ${{ secrets.BUNDLE_ALERT_WEBHOOK }}
      - name: Record snapshot
        run: node tools/bundle-trend.cjs collect --note "ci:${{ github.event_name }}"
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-history
          path: docs/metrics/bundle-history.json
          if-no-files-found: ignore
      - name: Commit ledger (main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "workspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/bundle-history.json
          if git diff --cached --quiet; then
            echo "ledger unchanged"
          else
            git commit -m "chore(perf): record bundle snapshot [skip ci]"
            git push
          fi
