name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Custom task for the agent'
        required: false
        default: ''
      provider:
        description: 'LLM provider to use (auto, openai, anthropic, gemini, etc.)'
        required: false
        default: 'auto'
  schedule:
    # Continuous autonomy — every 2 hours
    - cron: '0 */2 * * *'
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install PyGithub openai anthropic requests 2>/dev/null || pip install PyGithub requests

      - name: Cleanup stale auto-fix branches first
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python << 'PY'
          import os
          try:
              from github import Github
          except ImportError:
              raise SystemExit(0)
          token, repo = os.environ.get("GITHUB_TOKEN"), os.environ.get("REPO")
          if not token or not repo:
              raise SystemExit(0)
          g = Github(token)
          r = g.get_repo(repo)
          main_sha = r.get_branch("main").commit.sha
          for b in r.get_branches():
              if b.name in ("main", "master") or b.protected:
                  continue
              if not b.name.startswith("auto-fix-"):
                  continue
              try:
                  if b.commit.sha == main_sha:
                      r.get_git_ref(f"heads/{b.name}").delete()
                      print("deleted", b.name)
                      continue
                  cmp = r.compare("main", b.name)
                  if cmp.ahead_by == 0:
                      r.get_git_ref(f"heads/{b.name}").delete()
                      print("deleted-merged", b.name)
              except Exception as e:
                  print("skip", b.name, e)
          PY

      - name: Run v4.4 problem solvers (syntax / peer / lockfiles)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT_OWNS_GITHUB: '1'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/problem_solvers_runner.py ]; then
            python autonomous-github-agent/.github/scripts/problem_solvers_runner.py || true
          fi

      - name: Run Autonomous Agent on Monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          PROVIDER: ${{ inputs.provider }}
          AGENT_OWNS_GITHUB: '1'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/agent.py ]; then
            python autonomous-github-agent/.github/scripts/agent.py || true
          fi
          if [ -f singularity-operator/.github/scripts/agent.py ]; then
            (cd singularity-operator && python .github/scripts/agent.py) || true
          fi

      - name: Status Report
        run: |
          echo "Monorepo autonomous agent run completed"
          cat .agent_profile.json 2>/dev/null || echo "No global profile yet"
