name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Custom task for the agent'
        required: false
        default: ''
      provider:
        description: 'LLM provider to use (auto, openai, anthropic, gemini, etc.)'
        required: false
        default: 'auto'
  schedule:
    # Continuous autonomy — every 2 hours
    - cron: '0 */2 * * *'
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install PyGithub openai anthropic requests 2>/dev/null || pip install PyGithub requests

      - name: auto_ops (spam / Dependabot / branches / actionlint)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTO_MERGE_DEPENDABOT: '1'
          MAX_DEP_MERGES: '6'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/auto_ops.py ]; then
            python autonomous-github-agent/.github/scripts/auto_ops.py || true
          fi

      - name: Run v6.1 problem solvers (syntax / peer / lockfiles)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT_OWNS_GITHUB: '1'
          AUTO_MERGE_DEPENDABOT: '1'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/problem_solvers_runner.py ]; then
            python autonomous-github-agent/.github/scripts/problem_solvers_runner.py || true
          fi

      - name: Run Autonomous Agent on Monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          PROVIDER: ${{ inputs.provider }}
          AGENT_OWNS_GITHUB: '1'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/agent.py ]; then
            python autonomous-github-agent/.github/scripts/agent.py || true
          fi
          if [ -f singularity-operator/.github/scripts/agent.py ]; then
            (cd singularity-operator && python .github/scripts/agent.py) || true
          fi

      - name: Status Report
        run: |
          echo "Monorepo autonomous agent run completed"
          cat auto-ops-report.json 2>/dev/null || echo "No auto-ops report"
          cat .agent_profile.json 2>/dev/null || echo "No global profile yet"
