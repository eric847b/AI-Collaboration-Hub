name: nexus-core enforce

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check registry exists
        run: |
          test -f AI-Collaboration-Hub/nexus-core/registry.json || (echo "MISSING registry.json" && exit 1)

      - name: Validate modules against disk
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(".")
          reg = json.loads((root / "AI-Collaboration-Hub/nexus-core/registry.json").read_text())
          missing = []
          for m in reg["modules"]:
              name = m["name"]
              # Accept either top-level or nested under AI-Collaboration-Hub
              exists = (root / name).exists() or (root / "AI-Collaboration-Hub" / name).exists()
              if not exists:
                  missing.append(name)
          if missing:
              print("MISSING on disk:", ", ".join(missing))
              sys.exit(1)
          print(f"OK: {len(reg['modules'])} modules registered and present")
          PY

      - name: Orchestrator self-check
        # Soft boundary: registry validation remains hard-fail above.
        # Self-check can hit transient rate_limit/git noise; surface but do not
        # fail the whole enforce job solely on it (reduces FailureSolver spam).
        continue-on-error: true
        run: |
          cd AI-Collaboration-Hub/nexus-core
          python3 orchestrator.py check
