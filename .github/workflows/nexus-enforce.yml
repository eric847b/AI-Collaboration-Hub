name: nexus-core enforce

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check registry exists
        run: |
          test -f AI-Collaboration-Hub/nexus-core/registry.json || (echo "MISSING registry.json" && exit 1)

      - name: Validate required modules against disk
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(".")
          reg = json.loads((root / "AI-Collaboration-Hub/nexus-core/registry.json").read_text())
          missing = []
          for m in reg.get("modules") or []:
              name = m["name"]
              exists = (root / name).exists() or (root / "AI-Collaboration-Hub" / name).exists()
              if not exists:
                  missing.append(name)
          optional = [m.get("name") for m in (reg.get("optional_modules") or [])]
          if missing:
              print("MISSING on disk (required):", ", ".join(missing))
              sys.exit(1)
          print(f"OK: {len(reg.get('modules') or [])} required modules present")
          if optional:
              print(f"optional (not enforced): {', '.join(optional)}")
          PY

      - name: Orchestrator self-check
        continue-on-error: true
        run: |
          cd AI-Collaboration-Hub/nexus-core
          python3 orchestrator.py check
