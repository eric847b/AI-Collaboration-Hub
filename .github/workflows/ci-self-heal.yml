name: CI Self-Heal

# v5.2 — full autonomous repair + multi-repo + escalation + export + FailureSolver v3.4
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only (DRY_RUN=1)'
        required: false
        default: '0'
      max_tasks:
        description: 'MAX_SOLVER_TASKS'
        required: false
        default: '8'
      multi_repo:
        description: 'MULTI_REPO=1 metadata scan'
        required: false
        default: '0'
  workflow_run:
    workflows:
      - "Autonomous Agent"
      - "python-checks"
      - "lockfile-validation"
      - "all-projects-sanity"
      - "lint-autofix"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ci-self-heal
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: |
          pip install PyGithub requests 2>/dev/null || true
          pip install pip-audit 2>/dev/null || true

      - name: Proactive FailureSolver v3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f .github/run_failure_solver.py ]; then
            python .github/run_failure_solver.py || true
          elif [ -f autonomous-github-agent/.github/failure_solver.py ]; then
            PYTHONPATH=autonomous-github-agent/.github python -c "from failure_solver import get_failure_solver; import os; s = get_failure_solver(os.getenv('GITHUB_REPOSITORY','')); print(s.run_proactive_pass(max_issues=3))" || true
          else
            echo "FailureSolver not present — skip"
          fi

      - name: Cleanup stale auto-fix branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python << 'PY'
          import os
          try:
              from github import Github
          except ImportError:
              raise SystemExit(0)
          token, repo = os.environ.get("GITHUB_TOKEN"), os.environ.get("REPO")
          if not token or not repo:
              raise SystemExit(0)
          g = Github(token)
          r = g.get_repo(repo)
          main_sha = r.get_branch("main").commit.sha
          for b in r.get_branches():
              if b.name in ("main", "master") or b.protected:
                  continue
              if not b.name.startswith(("auto-fix-", "auto-fix/")):
                  continue
              try:
                  if b.commit.sha == main_sha:
                      r.get_git_ref(f"heads/{b.name}").delete()
                      print("deleted", b.name)
                      continue
                  cmp = r.compare("main", b.name)
                  if cmp.ahead_by == 0:
                      r.get_git_ref(f"heads/{b.name}").delete()
                      print("deleted-merged", b.name)
              except Exception as e:
                  print("skip", b.name, e)
          PY

      - name: Run problem solvers v5+
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT_OWNS_GITHUB: '1'
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MAX_SOLVER_TASKS: ${{ github.event.inputs.max_tasks || '8' }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/problem_solvers_runner.py ]; then
            python autonomous-github-agent/.github/scripts/problem_solvers_runner.py || true
          fi

      - name: Security audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT_OWNS_GITHUB: '1'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/security_audit.py ]; then
            python autonomous-github-agent/.github/scripts/security_audit.py || true
          fi

      - name: Multi-repo metadata scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MULTI_REPO: ${{ github.event.inputs.multi_repo || '0' }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/multi_repo.py ]; then
            python autonomous-github-agent/.github/scripts/multi_repo.py || true
          fi

      - name: Escalate recurring failures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/escalate.py ]; then
            python autonomous-github-agent/.github/scripts/escalate.py || true
          fi

      - name: Export Nexus state
        run: |
          if [ -f autonomous-github-agent/.github/scripts/collab_export.py ]; then
            python autonomous-github-agent/.github/scripts/collab_export.py || true
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: |
            agent-report.json
            security-audit-report.json
            multi-repo-report.json
            auto-fix-ledger.json
            last-nexus-consensus.json
            nexus-export.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        run: |
          echo "### CI Self-Heal v5.2 complete (FailureSolver wired)" >> $GITHUB_STEP_SUMMARY
          for f in agent-report.json multi-repo-report.json nexus-export.json; do
            if [ -f "$f" ]; then
              echo "#### $f" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              head -c 4000 "$f" >> $GITHUB_STEP_SUMMARY
              echo >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
