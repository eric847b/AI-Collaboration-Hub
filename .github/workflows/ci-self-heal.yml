name: CI Self-Heal

# v5.4 — auto_ops + solvers; workflow_run only on failure (no success thrash)
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only (DRY_RUN=1)'
        required: false
        default: '0'
      max_tasks:
        description: 'MAX_SOLVER_TASKS'
        required: false
        default: '8'
      multi_repo:
        description: 'MULTI_REPO=1 metadata scan'
        required: false
        default: '0'
      auto_merge_dependabot:
        description: 'AUTO_MERGE_DEPENDABOT (1=patch merges)'
        required: false
        default: '1'
  workflow_run:
    workflows:
      - "Autonomous Agent"
      - "python-checks"
      - "lockfile-validation"
      - "all-projects-sanity"
      - "lint-autofix"
      - "Workflow Lint"
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ci-self-heal
  cancel-in-progress: true

jobs:
  self-heal:
    runs-on: ubuntu-latest
    # schedule + dispatch always; workflow_run only when upstream failed
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: |
          pip install PyGithub requests 2>/dev/null || true
          pip install pip-audit 2>/dev/null || true

      - name: Proactive FailureSolver v3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f .github/run_failure_solver.py ]; then
            python .github/run_failure_solver.py || true
          elif [ -f autonomous-github-agent/.github/failure_solver.py ]; then
            PYTHONPATH=autonomous-github-agent/.github python -c "from failure_solver import get_failure_solver; import os; s = get_failure_solver(os.getenv('GITHUB_REPOSITORY','')); print(s.run_proactive_pass(max_issues=3))" || true
          else
            echo "FailureSolver not present — skip"
          fi

      - name: auto_ops (spam / Dependabot patches / branches / actionlint)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          AUTO_MERGE_DEPENDABOT: ${{ github.event.inputs.auto_merge_dependabot || '1' }}
          MAX_DEP_MERGES: '8'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/auto_ops.py ]; then
            python autonomous-github-agent/.github/scripts/auto_ops.py || true
          else
            echo "auto_ops.py not present — skip"
          fi

      - name: Run problem solvers v6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT_OWNS_GITHUB: '1'
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MAX_SOLVER_TASKS: ${{ github.event.inputs.max_tasks || '8' }}
          AUTO_MERGE_DEPENDABOT: ${{ github.event.inputs.auto_merge_dependabot || '1' }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/problem_solvers_runner.py ]; then
            python autonomous-github-agent/.github/scripts/problem_solvers_runner.py || true
          fi

      - name: Security audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT_OWNS_GITHUB: '1'
        run: |
          if [ -f autonomous-github-agent/.github/scripts/security_audit.py ]; then
            python autonomous-github-agent/.github/scripts/security_audit.py || true
          fi

      - name: Multi-repo metadata scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MULTI_REPO: ${{ github.event.inputs.multi_repo || '0' }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/multi_repo.py ]; then
            python autonomous-github-agent/.github/scripts/multi_repo.py || true
          fi

      - name: Escalate recurring failures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/escalate.py ]; then
            python autonomous-github-agent/.github/scripts/escalate.py || true
          fi

      - name: Export Nexus state
        run: |
          if [ -f autonomous-github-agent/.github/scripts/collab_export.py ]; then
            python autonomous-github-agent/.github/scripts/collab_export.py || true
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-report
          path: |
            agent-report.json
            auto-ops-report.json
            security-audit-report.json
            multi-repo-report.json
            auto-fix-ledger.json
            last-nexus-consensus.json
            nexus-export.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### CI Self-Heal v5.4 complete (failure-only workflow_run)"
            for f in auto-ops-report.json agent-report.json multi-repo-report.json nexus-export.json; do
              if [ -f "$f" ]; then
                echo "#### $f"
                echo '```json'
                head -c 4000 "$f"
                echo
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
