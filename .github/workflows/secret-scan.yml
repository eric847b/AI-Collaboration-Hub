name: Secret Scan
# Fail-fast gate that enforces the SECURITY.md promise (Never commit keys).
# Runs on every push/PR alongside the rotator test gate.
# Scans ONLY tracked files (git grep), so .gitignored secrets are out of scope
# by design — this catches anything a developer accidentally `git add -f`s.
on:
  push:
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.ps1'
      - '**/*.txt'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.cfg'
      - '.env'
      - '**/*.key'
      - '**/*.pem'
      - '.husky/**'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.ps1'
      - '**/*.txt'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.cfg'
      - '.env'
      - '**/*.key'
      - '**/*.pem'
      - '.husky/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for hardcoded secrets (fail on match)
        run: |
          set -e
          # Patterns: OpenAI (legacy/project), Anthropic, OpenRouter, Groq,
          # GitHub PATs (classic + fine-grained), Google API key, AWS access
          # key, Slack tokens, and PEM private-key blocks.
          if git grep -rIn -E '(sk-[a-zA-Z0-9]{48}|sk-proj-[a-zA-Z0-9_-]{32,}|sk-ant-[a-zA-Z0-9_-]{48,}|sk-or-v1-[a-f0-9]{32,64}|gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AIza[A-Za-z0-9_-]{35}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ; then
            echo "::error::Hardcoded secret detected in tracked files — commit rejected."
            echo "If this is a false positive, remove the match or move it to .gitignore-ignored storage."
            exit 1
          else
            echo "No hardcoded secrets found in tracked files."
          fi