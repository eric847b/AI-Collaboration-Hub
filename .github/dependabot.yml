version: 2
# Fleet-aligned Dependabot — labels feed AGA dependabot_coordinator.
# Patch-first groups; majors still open as separate PRs for human review.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "github-actions", "dependabot-coord"]
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      actions-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: "npm"
    directory: "/self-evolve-dash"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "npm", "dependabot-coord"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-dash:
        patterns: ["*"]
        update-types: ["patch"]

