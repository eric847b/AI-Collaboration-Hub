version: 2
# Expanded monorepo coverage — maximize free Dependabot (GitHub-native)
# Patches are grouped so auto_ops can merge one green PR instead of many.
updates:
  # --- GitHub Actions (keep workflows current) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers: ["eric847b"]
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-patches:
        update-types: ["patch"]

  # --- npm workspaces ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-root-patches:
        update-types: ["patch"]
  - package-ecosystem: "npm"
    directory: "/self-evolve-dash"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dash-patches:
        update-types: ["patch"]
  - package-ecosystem: "npm"
    directory: "/nexus-infinity-hub"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-nexus-patches:
        update-types: ["patch"]
  - package-ecosystem: "npm"
    directory: "/third-door-blink-controller"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-third-door-patches:
        update-types: ["patch"]
  - package-ecosystem: "npm"
    directory: "/ai-chat-websites"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-chat-patches:
        update-types: ["patch"]
  - package-ecosystem: "npm"
    directory: "/collabhub-modules"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-modules-patches:
        update-types: ["patch"]

  # --- Python ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-root-patches:
        update-types: ["patch"]
  - package-ecosystem: "pip"
    directory: "/autonomous-github-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-agent-patches:
        update-types: ["patch"]
  - package-ecosystem: "pip"
    directory: "/singularity-operator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-singularity-patches:
        update-types: ["patch"]
  - package-ecosystem: "pip"
    directory: "/solutions-dynamics"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      pip-solutions-patches:
        update-types: ["patch"]
