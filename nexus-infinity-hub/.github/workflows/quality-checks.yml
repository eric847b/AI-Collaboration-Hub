name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect lock file type
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "type=npm" >> $GITHUB_OUTPUT
          elif [ -f pnpm-lock.yaml ]; then
            echo "type=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "type=yarn" >> $GITHUB_OUTPUT
          else
            echo "type=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: ${{ steps.lockfile.outputs.type }}

      - name: Setup pnpm (if needed)
        if: steps.lockfile.outputs.type == 'pnpm'
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Yarn (if needed)
        if: steps.lockfile.outputs.type == 'yarn'
        run: npm install -g yarn

      - name: Install dependencies
        run: |
          case "${{ steps.lockfile.outputs.type }}" in
            npm)
              npm ci --prefer-offline --progress=false
              ;;
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
          esac

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test -- --coverage
        continue-on-error: false

      - name: Check coverage threshold (min 70%)
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            echo "Line coverage: $COVERAGE%"
            THRESHOLD=70
            if (( $(awk "BEGIN {print ($COVERAGE < $THRESHOLD)}") )); then
              echo "❌ Coverage below $THRESHOLD% threshold ($COVERAGE%)"
              exit 1
            else
              echo "✅ Coverage meets threshold ($COVERAGE%)"
            fi
          else
            echo "⚠️  Coverage file not found, skipping check"
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: javascript
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 30

      - name: Build project
        run: npm run build

      - name: Report bundle size
        if: always()
        run: npm run analyze

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Quality Check Results\n';
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const lines = coverage.total.lines.pct;
              comment += `- **Coverage**: ${lines}% ✅\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
