name: Self-Evolve Nexus Hub

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run evolve script
        id: evolve
        continue-on-error: true
        run: |
          if npm run evolve; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: '🤖 Auto-evolve: Updated modules - ${{ github.event.head_commit.timestamp }}'
          branch: auto-evolve/${{ github.run_number }}
          delete-branch: true
          title: '🤖 Auto-evolve: Module updates'
          body: |
            ## Auto-Evolution Report
            - **Trigger**: ${{ github.event_name }}
            - **Run ID**: ${{ github.run_id }}
            - **Timestamp**: ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            This PR contains automatically evolved modules and updates.
            
            Please review the changes and merge if approved.
            
            ---
            *Generated by GitHub Actions Auto-Evolve Workflow*
          labels: 'autogenerated,evolve'
          assignees: ''
          reviewers: ''

      - name: Workflow summary
        if: always()
        run: |
          echo "## 🤖 Auto-Evolve Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.evolve.outputs.status || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Detected**: ${{ steps.changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

