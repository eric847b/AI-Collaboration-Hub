name: registry sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch repositories
        run: |
          set -euo pipefail
          page=1
          while true; do
            curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/users/eric847b/repos?per_page=100&page=${page}" \
              > "repos-${page}.json"
            count=$(jq 'length' "repos-${page}.json")
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          jq -s 'add' repos-*.json > repos.json
          rm repos-*.json

      - name: build registry
        run: |
          node -e "
          const fs=require('fs');
          const repos=JSON.parse(fs.readFileSync('repos.json','utf8'));
          if(!Array.isArray(repos)) throw new Error('GitHub API returned a non-array response');

          function role(n){
            n=n.toLowerCase();
            if(n.includes('dashboard')||n.includes('ui')) return 'ui';
            if(n.includes('agent')||n.includes('operator')) return 'execution';
            if(n.includes('hub')) return 'coordination';
            if(n.includes('vector')||n.includes('fs')) return 'memory';
            if(n.includes('script')) return 'automation';
            return 'unclassified';
          }

          let reg={system:'nexus-core',version:'0.6',modules:[],roles:{execution:[],coordination:[],memory:[],ui:[],automation:[],unclassified:[]}};

          if(fs.existsSync('nexus-core/registry.json')){
            reg=JSON.parse(fs.readFileSync('nexus-core/registry.json','utf8'));
          }

          const seen=new Set(reg.modules.map(m=>m.name));

          for(const r of repos){
            if(!seen.has(r.name)){
              const rr=role(r.name);
              reg.modules.push({name:r.name,role:rr,entrypoint:'TBD',deps:[]});
            }
          }

          for(const roleName of ['execution','coordination','memory','ui','automation','unclassified']){
            reg.roles[roleName]=[];
          }
          for(const module of reg.modules){
            if(!reg.roles[module.role]) reg.roles[module.role]=[];
            reg.roles[module.role].push(module.name);
          }

          fs.mkdirSync('nexus-core',{recursive:true});
          fs.writeFileSync('nexus-core/registry.json',JSON.stringify(reg,null,2));
          console.log('done');
          "

      - name: create pr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "registry sync"
          commit-message: "update registry"
          branch: "registry-sync"
          base: "main"
          add-paths: |
            nexus-core/registry.json
          body: "update registry"
