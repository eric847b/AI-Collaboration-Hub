name: Telemetry Intake

# Closes the fleet telemetry loop: hub-side `telemetry-export.mjs sync-fleet`
# commits batch files under telemetry/inbox/; this workflow ingests them
# through the mirrored collector into telemetry/sink.jsonl, archives the
# batches and pushes the result back with the job token. Triggered ONLY by
# inbox pushes (intake commits touch ingest*/reject*, never inbox, so the
# path filter also guarantees there is no self-trigger loop) plus a weekly
# safety net and manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "telemetry/inbox/**/*.json"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Contract self-test (offline)
        run: node .github/agent_telemetry_intake.mjs --self-test

      - name: Ingest inbox batches
        id: ingest
        run: |
          out=$(node .github/agent_telemetry_intake.mjs)
          echo "$out"
          {
            echo "## telemetry intake"
            echo ""
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit intake results
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- telemetry)" ]; then
            echo "no intake changes (empty inbox) - nothing to commit"
            exit 0
          fi
          git config user.name "telemetry-intake[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- telemetry
          git commit -m "telemetry: ingest inbox batches (see Telemetry Intake run summary)"
          git push
