name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Custom task for the agent'
        required: false
        default: ''
      provider:
        description: 'LLM provider to use (auto, openai, anthropic, gemini, etc.)'
        required: false
        default: 'auto'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issues:
    types: [labeled]
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: autonomous-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'agent-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f autonomous-github-agent/requirements.txt ]; then
            python -m pip install -r autonomous-github-agent/requirements.txt
          fi
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install PyGithub openai anthropic google-generativeai pytest requests

      - name: Run Autonomous Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ -f autonomous-github-agent/.github/scripts/agent.py ]; then
            python autonomous-github-agent/.github/scripts/agent.py
          elif [ -f .github/scripts/agent.py ]; then
            python .github/scripts/agent.py
          else
            echo "agent.py not found" >&2
            exit 1
          fi

      - name: Verify Agent State
        run: |
          if [ -f autonomous-github-agent/.github/scripts/verify_perfect.py ]; then
            python autonomous-github-agent/.github/scripts/verify_perfect.py
          elif [ -f .github/scripts/verify_perfect.py ]; then
            python .github/scripts/verify_perfect.py
          fi

      - name: Status Report
        run: |
          echo "Autonomous agent run completed"
          echo "Profile: .agent_profile.json"
          cat .agent_profile.json 2>/dev/null || echo "No profile yet"