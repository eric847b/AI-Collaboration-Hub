[project]
name = "autonomous-github-agent"
version = "5.2.0"
description = "Self-healing multi-LLM GitHub agent (Nexus v5.2)"
requires-python = ">=3.11"
dependencies = [
  "PyGithub>=1.59.0",
  "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
  "pre-commit>=4.0.0",
  "pip-audit>=2.7.0",
]

# Free Ruff linter/formatter — https://docs.astral.sh/ruff/
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git", "Archive", "node_modules", ".venv", "venv", "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
